name: CI

on:
  push:
    branches: [ "main", "work" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build lcov libboost-dev libtbb-dev
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DENABLE_TESTING=ON -DENABLE_COVERAGE=ON \
            -DCMAKE_C_COMPILER=${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/tests/tests
      - name: Coverage
        run: |
          lcov --directory build --capture --output-file coverage.info --ignore-errors mismatch,negative
          lcov --summary coverage.info
